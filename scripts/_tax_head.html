<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Code-Mixing Tax — what AI models lose on romanized Hindi</title>
<meta name="description" content="16 open-weight AI models asked the same questions in
English, Hinglish, Hindi and their romanized forms. Writing in English letters costs more
than mixing languages does, and the two costs compound.">
<meta property="og:title" content="The Code-Mixing Tax">
<meta property="og:description" content="16 AI models, the same questions asked five ways.
Romanized Hindi can cost a model more than half its measurable ability.">
<meta property="og:type" content="article">
<meta name="twitter:card" content="summary_large_image">
<!-- og:image and og:url are omitted rather than set to a relative path: preview
     crawlers resolve them server-side, so a relative value renders an empty card.
     They need absolute URLs, which only exist once this page has a host. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+Devanagari:wght@600&display=swap">

<style>
/* Light is the primary palette; the dark counterpart is redefined token-for-token
   below so all three viewer states (explicit dark, explicit light, and the unstamped
   default that only exposes prefers-color-scheme) resolve as a complete set. */
:root{
  color-scheme:light;
  --ink:#1A2130; --body:#4A5158; --grey:#6B7280;
  --green:#2F8F38; --bright:#4CC43C; --orange:#F9A51A;
  --paper:#FBFBF8; --mint:#F3F5EF; --pale:#E7F5E4; --card:#FFFFFF;
  --line:#C9CCC2; --hair:#E9EBE4; --hl:#FFF7E8;
  --term-bg:#1A2130; --term-fg:#C9CFD8; --term-dim:#7A8290;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --neg:#C0392B;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ink:#EEF1F5; --body:#B8BFC7; --grey:#8B939F;
    --green:#5FBF66; --bright:#6FD65F; --orange:#F0AD3C;
    --paper:#14171B; --mint:#1B1F24; --pale:#1B2A1D; --card:#1B1E24;
    --line:#2E3339; --hair:#262B31; --hl:#2A2317;
    --term-bg:#0F1215; --term-fg:#C9CFD8; --term-dim:#7A8290;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --neg:#E06A5C;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ink:#EEF1F5; --body:#B8BFC7; --grey:#8B939F;
  --green:#5FBF66; --bright:#6FD65F; --orange:#F0AD3C;
  --paper:#14171B; --mint:#1B1F24; --pale:#1B2A1D; --card:#1B1E24;
  --line:#2E3339; --hair:#262B31; --hl:#2A2317;
  --term-bg:#0F1215; --term-fg:#C9CFD8; --term-dim:#7A8290;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --neg:#E06A5C;
}

*{box-sizing:border-box; margin:0}
/* Google Fonts is the only external request this page makes, and it can be
   blocked (corporate proxies, ad-blockers, offline). Each stack below ends in a
   system font that is present everywhere, so the page degrades to a near-identical
   monospace/grotesque pairing rather than falling back to Times. */
body{background:var(--paper); color:var(--body);
  font-family:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,
    'DejaVu Sans Mono',monospace; font-size:14px; line-height:1.65;
  -webkit-font-smoothing:antialiased}
h1,h2,h3,h4,.arch{font-family:'Archivo','Helvetica Neue',Helvetica,Arial,
  system-ui,sans-serif; color:var(--ink)}
a{color:var(--green)}
.wrap{max-width:1040px; margin:0 auto; padding:0 28px}
code{font-family:inherit; background:var(--mint); border:1px solid var(--hair);
  border-radius:2px; padding:.05em .3em; font-size:.92em; color:var(--ink)}
b,strong{color:var(--ink); font-weight:600}
em{font-style:italic}

/* ---- masthead chrome ---- */
.statusbar{background:var(--orange); color:#1A2130; text-align:center; padding:9px 16px;
  font-weight:600; font-size:12.5px; letter-spacing:.04em}
nav{display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:18px 28px; background:var(--card); flex-wrap:wrap;
  border-bottom:4px solid;
  border-image:linear-gradient(90deg,var(--bright) 33%,var(--card) 33% 66%,var(--orange) 66%) 1}
.logo{display:flex; align-items:center; gap:10px; font-family:'Archivo',sans-serif;
  font-weight:800; font-size:20px; color:var(--ink)}
.logo .mark{width:30px; height:30px; border-radius:50%; background:var(--green); color:#fff;
  display:grid; place-items:center; font-family:'Noto Sans Devanagari','Nirmala UI','Mangal',sans-serif; font-size:14px}
.navlinks{display:flex; gap:22px; font-size:13px; flex-wrap:wrap}
.navlinks a{color:var(--body); text-decoration:none}
.navlinks a:hover{color:var(--green)}
.navlinks a.on{color:var(--green); font-weight:600}
.navlinks a:focus-visible{outline:2px solid var(--green); outline-offset:2px}

/* ---- abstract card band ---- */
.indexdemo{background:var(--mint); padding:44px 0 40px; border-bottom:1px solid var(--line)}
.card{background:var(--card); border:1px solid var(--line); padding:26px 28px; max-width:820px}
.card .path{color:var(--green); font-size:12.5px}
.card .card-title{font-family:'Archivo',sans-serif; font-weight:700; color:var(--ink);
  font-size:21px; margin:6px 0 10px; line-height:1.25}
.chip{display:inline-block; border:1px solid var(--line); padding:1px 8px; font-size:11px;
  color:var(--grey); border-radius:2px; margin-left:6px; vertical-align:2px; white-space:nowrap}
.chip-open{color:var(--green); border-color:var(--green)}
/* darkened from #B87709: that was ~3.6:1 on the cream chip background,
   under the 4.5:1 bar for text this size. #8A5A06 measures ~5.9:1. */
.chip-india{color:#8A5A06; border-color:var(--orange); background:var(--hl)}
:root[data-theme="dark"] .chip-india{color:var(--orange)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip-india{color:var(--orange)}}
.linksrow{margin-top:14px; font-size:12.5px; color:var(--grey)}

/* ---- report body ---- */
.report{padding:44px 0 30px}
.report .path{color:var(--green); font-size:13px}
h1{font-size:clamp(30px,4.6vw,44px); font-weight:800; line-height:1.12; margin:10px 0 8px;
  letter-spacing:-.01em; text-wrap:balance}
h1 .g{color:var(--green)}
.meta{font-size:12.5px; color:var(--grey); margin-bottom:34px}
section{margin-bottom:52px; scroll-margin-top:20px}
h2{font-size:15px; letter-spacing:.05em; text-transform:lowercase; color:var(--green);
  margin-bottom:18px; font-weight:600}
h2::before{content:"// "; color:var(--line)}
.panel{background:var(--card); border:1px solid var(--line); padding:26px}
.panel > * + *{margin-top:14px}
.panel p{font-size:13.5px}
.lead{font-size:15px; color:var(--ink)}

/* ---- numbered insights ---- */
.key-insights ol{counter-reset:ki; list-style:none; padding:0; margin:0}
.key-insights li{position:relative; padding-left:44px; margin-bottom:22px}
.key-insights li::before{counter-increment:ki;
  content:counter(ki,decimal-leading-zero); position:absolute; left:0; top:0;
  font-family:'Archivo',sans-serif; font-weight:800; font-size:22px; color:var(--orange); line-height:1}
.key-insights li h3{font-size:15px; margin:0 0 6px; line-height:1.4}
.key-insights li p{font-size:13px; line-height:1.65; margin:0}
.key-insights .also{border-top:1px solid var(--line); padding-top:18px; margin-top:24px}
.key-insights .also h4{font-family:'Archivo',sans-serif; font-size:13px; color:var(--ink); margin:0 0 10px}
.key-insights .also ul{list-style:disc; padding-left:18px; margin:0}
.key-insights .also li{padding-left:0; margin-bottom:8px; font-size:13px; line-height:1.6}
.key-insights .also li::before{display:none}

/* ---- tables ---- */
.tablewrap{overflow-x:auto; border:1px solid var(--line); background:var(--card);
  /* the widest tables run past the column on any screen; make that discoverable
     rather than silently clipping the last column */
  scrollbar-color:var(--line) var(--card)}
/* first column stays put while the rest scrolls, so a row never loses its label */
.tablewrap th:first-child,.tablewrap td:first-child{position:sticky; left:0;
  background:var(--card); z-index:1}
.tablewrap tbody tr:hover td:first-child{background:var(--mint)}
.scrollnote{font-size:11.5px; color:var(--grey); letter-spacing:.04em; margin:6px 0 0}
table{width:100%; border-collapse:collapse; font-size:13px; background:var(--card)}
caption{caption-side:top; text-align:left; padding:16px 12px 10px; font-family:'Archivo',sans-serif;
  font-weight:700; font-size:14px; color:var(--ink)}
th{text-align:left; font-weight:600; color:var(--ink); border-bottom:2px solid var(--ink);
  padding:9px 10px; font-size:12px; letter-spacing:.04em; white-space:nowrap}
td{border-bottom:1px solid var(--hair); padding:8px 10px; color:var(--body);
  font-variant-numeric:tabular-nums; white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--mint)}
th:not(:first-child),td:not(:first-child){text-align:right}
td.hi{color:var(--ink); font-weight:600}
td.dn{color:var(--neg); font-weight:500}
td.dim{color:var(--grey)}
td.ci,.ci{color:var(--grey); font-size:12px; font-weight:400}
.tnote{font-size:12px; color:var(--grey); margin-top:10px}

/* Prose tables: cells hold sentences, not figures, so they must wrap. The
   default `white-space:nowrap` is right for numeric tables and disastrous here. */
.tablewrap.prose table{table-layout:fixed}
.tablewrap.prose td,.tablewrap.prose th{white-space:normal; vertical-align:top}
.tablewrap.prose td:not(:first-child),.tablewrap.prose th:not(:first-child){text-align:left}
.tablewrap.prose td:first-child{width:26%; font-weight:600; color:var(--ink)}
/* key/value variant has no meaningful header row */
.tablewrap.kv thead{display:none}
.tstack > * + *{margin-top:22px}

/* ---- figures: matplotlib output, one variant per theme ---- */
.figwrap{background:var(--card); border:1px solid var(--line); padding:20px 22px 10px;
  overflow-x:auto}
figure{margin:0}
.figlinks{font-size:11.5px; margin-top:8px}
.figlinks a{color:var(--green); text-decoration:none; margin-right:14px}
.figlinks a:hover{text-decoration:underline}
.figwrap svg{display:block; width:100%; height:auto; max-width:100%}
.figpair{display:block}
.fig-dark{display:none}
.fig-light{display:block}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .fig-light{display:none}
  :root:not([data-theme="light"]) .fig-dark{display:block}
}
:root[data-theme="dark"] .fig-light{display:none}
:root[data-theme="dark"] .fig-dark{display:block}
:root[data-theme="light"] .fig-light{display:block}
:root[data-theme="light"] .fig-dark{display:none}
/* The figures are matplotlib SVGs with fixed-size label paths: scaled to a
   390px viewport their model names blur out. Below 720px each figure keeps its
   natural width inside a horizontally scrollable frame instead of shrinking,
   and the caption says so. Pinch-zoom still works on top of that. */
@media (max-width:720px){
  .figwrap{padding:14px 0 6px; overflow-x:auto; -webkit-overflow-scrolling:touch}
  .figwrap .figpair{min-width:680px}
  .figwrap svg{width:680px; max-width:none}
  .figscroll-hint{display:block}
}
.figscroll-hint{display:none; font-size:11.5px; color:var(--grey);
  letter-spacing:.04em; margin:6px 0 0}
.figcap{font-size:12.5px; color:var(--grey); margin-top:10px}
.figcap b{color:var(--ink)}

/* ---- the language-form axis strip ---- */
.forms{display:grid; grid-template-columns:repeat(5,1fr); gap:0;
  border:1px solid var(--line); background:var(--card); overflow:hidden}
@media(max-width:900px){.forms{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.forms{grid-template-columns:1fr}}
.form-cell{padding:16px 16px 18px; border-right:1px solid var(--hair); position:relative}
.form-cell:last-child{border-right:none}
.form-cell::before{content:""; position:absolute; inset:0 0 auto 0; height:3px; background:var(--step)}
.form-cell .n{font-size:11px; color:var(--grey); letter-spacing:.08em}
.form-cell .code{font-family:'Archivo',sans-serif; font-weight:800; font-size:17px;
  color:var(--ink); margin:8px 0 5px}
.form-cell .desc{font-size:12.5px; line-height:1.5}
.form-cell .src{margin-top:9px; font-size:11px; color:var(--grey); word-break:break-word}

/* ---- terminal + credit blocks ---- */

.credit{background:var(--pale); border-left:4px solid var(--green); padding:18px 22px; font-size:13px}
.credit h4{font-family:'Archivo',sans-serif; font-size:13px; color:var(--ink); margin:0 0 8px}
.credit p + p{margin-top:10px}
.warnblock{background:var(--hl); border-left:4px solid var(--orange); padding:18px 22px; font-size:13px}
.warnblock h4{font-family:'Archivo',sans-serif; font-size:13px; color:var(--ink); margin:0 0 8px}
.warnblock p + p{margin-top:10px}
.stripline{font-size:13px; margin-top:18px}
.stripline a{color:var(--green); font-weight:600; text-decoration:none; margin-right:18px}
.stripline a:hover{text-decoration:underline}

/* ---- headline stat row ---- */
.stats{display:grid; grid-template-columns:repeat(4,1fr); gap:0;
  border:1px solid var(--line); background:var(--card); overflow:hidden}
@media(max-width:820px){.stats{grid-template-columns:1fr 1fr}}
.stat-cell{padding:18px 18px 16px; border-right:1px solid var(--hair)}
.stat-cell:last-child{border-right:none}
.stat-cell .lab{font-size:11px; letter-spacing:.08em; color:var(--grey); text-transform:uppercase}
.stat-cell .val{font-family:'Archivo',sans-serif; font-weight:800; font-size:34px; line-height:1.05;
  letter-spacing:-.03em; margin:10px 0 6px; color:var(--ink); font-variant-numeric:tabular-nums}
.stat-cell .val.down{color:var(--neg)}
.stat-cell .sub{font-size:12.5px; line-height:1.5}

footer{border-top:1px solid var(--line); padding:26px 28px; font-size:12px; color:var(--grey);
  display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

notes: >-
  MPT architecture, the only one of its kind in this suite. Worth watching its
  tokenizer: MPT ships a GPT-NeoX tokenizer with no Indic-specific vocabulary, so
  Devanagari should fragment badly -- the opposite of Param-1's 256k Indic-first
  vocabulary. That contrast is the interesting part of including it.

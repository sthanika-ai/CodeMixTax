# Llama 3.1 8B served by the Ollama daemon already running on this machine.
#
# Ollama identifies models by its own short tag, not the Hugging Face repo id,
# so served_model_name is what actually goes on the wire. hf_id is kept as the
# upstream provenance record for the report.
hf_id: meta-llama/Llama-3.1-8B-Instruct
served_model_name: llama3.1:8b
display_name: Llama 3.1 8B (Ollama, Q4_K_M)
backend: openai
base_url: http://localhost:11434/v1

params_b: 8
architecture: dense
license: llama3.1-community
status: verified
quantization: Q4_K_M
notes: >-
  Ollama serves this as a 4-bit Q4_K_M GGUF, NOT bf16 -- so this is a quantised
  data point and must be labelled as such in the report; it is not comparable to a
  bf16 Llama 3.1 8B run. Ollama on this host is started with `-np 4`, i.e. four
  parallel slots, so concurrency above 4 just queues without gaining throughput.
  It also runs with `--no-jinja --chat-template chatml`, overriding Llama's own
  template; note that as a caveat since prompt formatting differs from the
  reference implementation.
concurrency: 4
request_timeout: 900.0

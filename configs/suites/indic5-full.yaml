# The headline sweep: every registered model x all 18 Indic splits (21,256 rows).
#
#   cmb-indic run --suite indic5-full
#
# Cost. 21,256 rows per model. The token-level splits dominate wall clock because
# they generate ~1 output token per input token. Budget roughly 1-3 hours per
# 8B-class model on a single modern GPU with vLLM, and correspondingly more for the
# 24-30B models. Generations are cached, so an interrupted sweep resumes for free.
#
# Trim the model list before running this. Not every entry fits on one node:
# llama4-scout (109B total) and deepseek-v4-flash need multi-GPU.

models:
  # Gemma family
  - gemma3-4b-it
  - gemma3-12b-it
  - gemma3-12b-it-int4
  - gemma3-27b-it
  - gemma4-12b-it
  # Qwen family
  - qwen3-8b
  - qwen3-8b-int4
  - qwen3.5-9b
  - qwen3.6-27b
  - qwen3.6-27b-int4
  - qwen3-vl-8b
  # Indic-first
  - sarvam-1-2b
  - sarvam-m-24b
  - sarvam-30b
  # Others
  - llama3.1-8b-it
  - llama4-scout
  - deepseek-v4-flash
  - mistral-small-3.1-24b
  - phi-4-14b
  - gpt-oss-20b

run:
  datasets: [all]
  shots: 0
  extraction: robust
  seed: 1234

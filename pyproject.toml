[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cmb-indic"
version = "0.1.0"
description = "Reproducible evaluation of local LLMs on the CodeMixBench Indic (Hindi/Bengali/Marathi/Tamil/Malayalam) subset"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["code-mixing", "code-switching", "llm-evaluation", "benchmark", "indic-nlp"]
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core dependencies: enough to load data, build prompts, score, and drive an
# OpenAI-compatible server (vLLM / Ollama / SGLang / llama.cpp / LM Studio / TGI).
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.5.0",  # CVE-2024-5206: TfidfVectorizer leaked training tokens via stop_words_
  "sacrebleu>=2.4",
  "datasets>=5.0.1",  # CVE-2026-66007: path traversal via file_name in folder-based builders
  "huggingface-hub>=0.23",
  "openai>=1.40",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "tqdm>=4.66.3",  # CVE-2024-34062: argument injection in the tqdm CLI
  "tabulate>=0.9",
]

[project.optional-dependencies]
# In-process vLLM backend (fastest for full 21k-row sweeps).
#
# PINNED, and the pin is load-bearing -- see docs/COMPATIBILITY.md:
#   * vLLM >= 0.20 requires torch+cu130 (CUDA 13), i.e. NVIDIA driver >= 580.
#     0.10.1.x pins torch 2.7.1+cu126, which runs on any CUDA 12.x driver.
#   * 0.10.1.1 rather than 0.10.1: it is the patch release for CVE-2025-9141
#     (RCE in the Qwen3-Coder tool-call parser) and CVE-2025-48956 (DoS), and is
#     the newest vLLM inside this torch/driver envelope. Advisories that are only
#     fixed in 0.11+ stay open on this pin -- see docs/SECURITY.md.
#   * vLLM 0.10.1 declares transformers>=4.55.0 with no upper bound, but
#     transformers 5.x renamed the rope config keys and breaks it with
#     "ValueError: rope_scaling should have a 'rope_type' key". Hence the ==.
#   * After installing, `pip uninstall flashinfer-python` if a newer vLLM was
#     ever present: a stale CUDA-13 build fails engine startup.
# On a driver >= 580, relax both pins to pick up Gemma 4 support.
vllm = ["vllm==0.10.1.1", "transformers==4.55.2"]
# transformers backend, incl. bitsandbytes INT4 for the quantized variants.
# transformers floor is 4.53.0 (ReDoS: CVE-2025-3933, -3777, -5197, -6051, -6638,
# -6921) and sentencepiece 0.2.1 (heap overflow: CVE-2026-1260). The torch floor
# stays at 2.3 on purpose: vLLM 0.10.1.x pins torch==2.7.1, so raising it would make
# `[all]` unresolvable. A plain `pip install .[hf]` resolves torch to the current
# release anyway -- see docs/SECURITY.md.
hf = ["torch>=2.3", "transformers>=4.53.0", "accelerate>=0.30", "bitsandbytes>=0.43", "sentencepiece>=0.2.1"]
# Plots for the report.
viz = ["matplotlib>=3.8"]
# Rebuilding the romanized conditions from the Devanagari sources. Pinned: the
# scheme tables are data, so a different version can silently change the text
# the models were shown. 2.3.82 is what produced the shipped conditions.
roman = ["indic-transliteration==2.3.82"]
# pytest floor 9.0.3 (CVE-2025-71176, tmpdir handling) and black 26.3.1
# (CVE-2024-21503 ReDoS, CVE-2026-31900, CVE-2026-32274).
dev = ["pytest>=9.0.3", "pytest-cov>=5.0", "ruff>=0.6", "black>=26.3.1", "pre-commit>=3.7"]
all = ["cmb-indic[vllm,hf,viz,roman,dev]"]

[project.scripts]
cmb-indic = "cmb_indic.cli:main"

[project.urls]
Homepage = "https://github.com/sthanika-ai/CodeMixTax"
Dataset = "https://huggingface.co/datasets/CodeMixBench/CodeMixBench"
Paper = "https://aclanthology.org/2025.emnlp-main.109/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cmb_indic = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
# The vendored upstream reference implementation is intentionally not linted.
extend-exclude = ["utils.py", "test_model.py", "oaib", "semantic_metrics.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET"]
ignore = ["E501", "B008"]

[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = "^/(utils|test_model)\\.py|^/oaib/"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: requires a live model server or GPU",
  "network: requires network access (HF Hub)",
]

[tool.bandit]
# `assert` in tests is pytest's assertion-rewriting mechanism, not a stripped
# security check -- see docs/SECURITY.md "Scanner findings that are not
# defects". Everything under src/ and scripts/ is still scanned.
exclude_dirs = ["tests", "build", ".venv"]
